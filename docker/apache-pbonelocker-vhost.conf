# -----------------------------------------------------------------------------
# VirtualHost APACHE (host) — pbonelocker.com.br → Docker (frontend em 8082)
#
# Pré-requisito (Debian/Ubuntu):
#   sudo a2enmod proxy proxy_http headers ssl rewrite
#   sudo systemctl restart apache2
#
# Instalação sugerida:
#   sudo cp docker/apache-pbonelocker-vhost.conf /etc/apache2/sites-available/pbonelocker.conf
#   sudo a2ensite pbonelocker.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# TLS (depois que o HTTP estiver ok; inclua www só se o DNS existir):
#   sudo certbot --apache -d pbonelocker.com.br
# -----------------------------------------------------------------------------

<VirtualHost *:80>
    ServerName pbonelocker.com.br
    # Descomente se houver registro DNS para www:
    # ServerAlias www.pbonelocker.com.br

    # Não servir arquivos locais; tudo vai para o container (Nginx interno)
    ProxyPreserveHost On
    # HTTP → "http", HTTPS (após Certbot) → "https" — uma linha para ambos
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    ProxyPass        / http://127.0.0.1:8082/
    ProxyPassReverse / http://127.0.0.1:8082/

    # Limite de upload alinhado ao nginx do container (10M)
    LimitRequestBody 10485760

    ErrorLog ${APACHE_LOG_DIR}/pbonelocker-error.log
    CustomLog ${APACHE_LOG_DIR}/pbonelocker-access.log combined
</VirtualHost>
