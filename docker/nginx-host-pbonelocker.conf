# -----------------------------------------------------------------------------
# Exemplo para o Nginx DO HOST (não é o nginx dentro do container).
# Instale como site separado — não altera default_server nem outros domínios.
#
# 1) DNS A/AAAA de pbonelocker.com.br → IP deste servidor
# 2) Docker com: ports - "127.0.0.1:8082:80" no serviço frontend
# 3) sudo cp docker/nginx-host-pbonelocker.conf /etc/nginx/sites-available/pbonelocker
# 4) sudo ln -sf /etc/nginx/sites-available/pbonelocker /etc/nginx/sites-enabled/
# 5) sudo nginx -t && sudo systemctl reload nginx
# 6) sudo certbot --nginx -d pbonelocker.com.br -d www.pbonelocker.com.br
# -----------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name pbonelocker.com.br www.pbonelocker.com.br;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10M;
    }
}

# Após o Certbot, ele costuma acrescentar o bloco listen 443 ssl e os certificados.
# Não edite manualmente outros arquivos em sites-enabled.
